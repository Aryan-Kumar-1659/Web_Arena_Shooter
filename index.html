<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Arena Shooter — 2D Top-Down Shooter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090d16;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #131d31 0%, #080c14 100%);
    }
    #gameCanvas {
      background-color: #0b1120;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      cursor: crosshair;
      border: 1px solid #1e293b;
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #090d16;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.4s ease;
      color: #ffffff;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #38bdf8;
      margin-bottom: 20px;
    }
    .progress-bar-container {
      width: 320px;
      height: 12px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #2563eb);
      transition: width 0.15s ease-out;
    }
    .progress-text {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="loading-overlay">
      <div class="loader-title">LOADING ASSETS...</div>
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>
      <div id="progress-text" class="progress-text">Initializing subsystems...</div>
    </div>
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
