<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Arena Shooter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 95vw;
      max-width: 1920px;
      max-height: 88vh;
      aspect-ratio: 16 / 9;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 200, 255, 0.2);
      border-radius: 8px;
      overflow: hidden;
      background-color: #1a1d29;
    }
    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      cursor: crosshair;
    }
    .instructions {
      margin-top: 10px;
      color: #8f9ba8;
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
    }
    .instructions kbd {
      background-color: #1e293b;
      color: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #334155;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="1920" height="1080"></canvas>
  </div>
  <div class="instructions">
    Movement: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <kbd>Arrow Keys</kbd> &nbsp;|&nbsp; Aim: <kbd>Mouse</kbd> &nbsp;|&nbsp; Fire: <kbd>Left Click</kbd> &nbsp;|&nbsp; Switch: <kbd>1</kbd>/<kbd>2</kbd> &nbsp;|&nbsp; Reload: <kbd>R</kbd> &nbsp;|&nbsp; Start/Restart: <kbd>Space</kbd> / <kbd>Click</kbd>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
